name: Session and identity reference tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install fastapi==0.141.1 httpx==0.28.1 pillow==12.3.0 python-multipart==0.0.32 opencv-python-headless==4.13.0.92 pytest
      - run: python -m pytest tests -q
